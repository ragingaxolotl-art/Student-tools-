name: Publish Digital Media Resources

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify Arena Lab
        run: node --test arena-lab/core.test.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        
      - name: Unpack website
        run: |
          mkdir -p _site
          unzip -q site.zip -d _site
          cp -R arena-lab _site/arena-lab
          cp site-overrides/version-nav.js _site/version-nav.js
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
